version: 2
# Keep shared images (including Vector's Dockerfile and Compose references) together.
multi-ecosystem-groups:
  container-images:
    schedule:
      interval: weekly
    labels: ["dependencies", "type:dependencies"]
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
updates:
  - package-ecosystem: cargo
    directories: [/]
    labels: ["dependencies", "type:dependencies", "rust"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      rust-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies", "type:dependencies", "github_actions"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
  - package-ecosystem: uv
    directory: /
    labels: ["dependencies", "type:dependencies"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      python-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /tools/cli-playground/frontend
    labels: ["dependencies", "type:dependencies", "javascript"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      frontend-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /infra/images
      - /tools/cli-playground
    patterns: ['*']
    multi-ecosystem-group: container-images
  - package-ecosystem: docker
    directories:
      - /packages/boxie/sandbox
      - /packages/boxie/tests/integration
    patterns: ['*']
    multi-ecosystem-group: container-images
    # Refresh the Ubuntu digest within the supported sandbox release series.
    ignore:
      - dependency-name: ubuntu
        versions: ['< 24.04', '>= 24.05']
  - package-ecosystem: docker-compose
    directory: /infra/services
    schedule:
      interval: weekly
    labels: ["dependencies", "type:dependencies", "docker", "risk:high", "impact:persistence"]
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
  - package-ecosystem: rust-toolchain
    directory: /
    labels: ["dependencies", "type:dependencies", "rust"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
