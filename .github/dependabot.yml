version: 2
# Keep shared images (including Vector's Dockerfile and Compose references) together.
multi-ecosystem-groups:
  container-images:
    schedule:
      interval: weekly
    labels: ["dependencies", "type:dependencies"]
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
updates:
  - package-ecosystem: cargo
    directories: [/]
    labels: ["dependencies", "type:dependencies", "rust"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      rust-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies", "type:dependencies", "github_actions"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
  - package-ecosystem: uv
    directory: /
    labels: ["dependencies", "type:dependencies"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      python-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /tools/cli-playground/frontend
    labels: ["dependencies", "type:dependencies", "javascript"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      frontend-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /packages/boxie/infra
      - /packages/boxie/infra/observability/collector
      - /packages/boxie/sandbox
      - /packages/boxie/tests/integration
      - /tools/cli-playground
      - /tools/cli-playground/infra/docker
    patterns: ['*']
    multi-ecosystem-group: container-images
  - package-ecosystem: docker-compose
    directory: /packages/boxie/infra/postgres
    schedule:
      interval: weekly
    labels: ["dependencies", "type:dependencies", "docker", "risk:high", "impact:persistence"]
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
  - package-ecosystem: docker-compose
    directories:
      - /packages/boxie/infra/ingress
      - /packages/boxie/infra/observability
      - /packages/boxie/infra/temporal
      - /tools/cli-playground/infra
    patterns: ['*']
    multi-ecosystem-group: container-images
    # Local development defaults are built here, not published upstream dependencies.
    ignore:
      - dependency-name: boxie-collector
      - dependency-name: cli-playground
  - package-ecosystem: rust-toolchain
    directory: /
    labels: ["dependencies", "type:dependencies", "rust"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
