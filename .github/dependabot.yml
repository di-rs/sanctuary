version: 2
updates:
  - package-ecosystem: cargo
    directories: [/]
    labels: ["dependencies", "type:dependencies", "rust"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      rust-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    labels: ["dependencies", "type:dependencies", "github_actions"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
  - package-ecosystem: uv
    directory: /
    labels: ["dependencies", "type:dependencies"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      python-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /tools/cli-playground/frontend
    labels: ["dependencies", "type:dependencies", "javascript"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ':arrow_up: deps'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ['*']
      frontend-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
