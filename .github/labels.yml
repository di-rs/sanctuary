{
  "version": 1,
  "labels": [
    {
      "name": "type:feature",
      "description": "Add or extend supported behavior.",
      "owner": "author",
      "color": "0366d6"
    },
    {
      "name": "type:fix",
      "description": "Correct incorrect behavior.",
      "owner": "author",
      "color": "0366d6"
    },
    {
      "name": "type:refactor",
      "description": "Restructure implementation without intended behavior changes.",
      "owner": "author",
      "color": "0366d6"
    },
    {
      "name": "type:performance",
      "description": "Improve runtime, memory use, or throughput.",
      "owner": "author",
      "color": "0366d6"
    },
    {
      "name": "type:docs",
      "description": "Change documentation only.",
      "owner": "author",
      "color": "0366d6"
    },
    {
      "name": "type:tests",
      "description": "Change tests, fixtures, or reference generators only.",
      "owner": "author",
      "color": "0366d6"
    },
    {
      "name": "type:dependencies",
      "description": "Update dependencies or lockfiles.",
      "owner": "author",
      "color": "0366d6"
    },
    {
      "name": "type:maintenance",
      "description": "Change CI, packaging, development tooling, or repository policy.",
      "owner": "author",
      "color": "0366d6"
    },
    {
      "name": "area:biggie",
      "description": "Changes biggie.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "packages/biggie/**"
      ]
    },
    {
      "name": "area:boxie",
      "description": "Changes boxie.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "packages/boxie/**"
      ]
    },
    {
      "name": "area:kara",
      "description": "Changes kara.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "packages/kara/**"
      ]
    },
    {
      "name": "area:parsu",
      "description": "Changes parsu.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "packages/parsu/**"
      ]
    },
    {
      "name": "area:shish",
      "description": "Changes shish.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "packages/shish/**"
      ]
    },
    {
      "name": "area:builtins",
      "description": "Changes builtins.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "buildins/**"
      ]
    },
    {
      "name": "area:shared-libraries",
      "description": "Changes shared libraries.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "utils/**"
      ]
    },
    {
      "name": "area:playground",
      "description": "Changes playground.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "tools/cli-playground/**"
      ]
    },
    {
      "name": "area:benchmarks",
      "description": "Changes benchmarks.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "tools/cli-bench/**"
      ]
    },
    {
      "name": "area:repo-tooling",
      "description": "Changes repo tooling.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "tools/cli-check/**",
        "tools/pr-labels/pr_labels.py",
        "tools/pr-labels/tests/**",
        "AGENTS.md",
        ".agents/**",
        ".codex/**",
        ".github/labels.yml",
        ".github/pull_request_template.md",
        "prek.toml",
        "Makefile",
        "bacon.toml",
        "lychee.toml",
        "typos.toml",
        ".config/**",
        ".zed/**"
      ]
    },
    {
      "name": "area:infrastructure",
      "description": "Changes infrastructure.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "infra/**",
        "**/infra/**",
        "Dockerfile",
        "Dockerfile.*",
        "**/Dockerfile",
        "**/Dockerfile.*",
        "compose*.yml",
        "compose*.yaml",
        "**/compose*.yml",
        "**/compose*.yaml",
        "**/docker-compose*.yml",
        "**/docker-compose*.yaml"
      ]
    },
    {
      "name": "area:ci",
      "description": "Changes ci.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        ".github/workflows/**",
        ".github/actions/**",
        ".github/rulesets/**",
        ".github/dependabot.yml",
        ".github/actionlint.yaml",
        "**/action.yml",
        "**/action.yaml"
      ]
    },
    {
      "name": "area:workspace",
      "description": "Changes workspace.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "Cargo.toml",
        "Cargo.lock",
        "pyproject.toml",
        "uv.lock",
        "rust-toolchain*",
        ".python-version",
        ".cargo/**",
        "clippy.toml",
        "deny.toml",
        ".gitignore"
      ]
    },
    {
      "name": "area:docs",
      "description": "Changes docs.",
      "owner": "paths",
      "color": "7057ff",
      "paths": [
        "*.md",
        "**/*.md",
        "docs/**",
        "**/docs/**"
      ]
    },
    {
      "name": "risk:low",
      "description": "Narrow, readily reversible change with limited consequences if incorrect.",
      "owner": "author",
      "color": "0e8a16"
    },
    {
      "name": "risk:medium",
      "description": "Runtime or shared behavior changes with a bounded impact.",
      "owner": "author",
      "color": "fbca04"
    },
    {
      "name": "risk:high",
      "description": "Potential data loss, trust-boundary changes, privileged operations, or difficult recovery.",
      "owner": "author",
      "color": "d73a4a"
    },
    {
      "name": "impact:breaking",
      "description": "Incompatible change to supported CLI, API, schema, or configuration behavior.",
      "owner": "author",
      "color": "d4c5f9"
    },
    {
      "name": "impact:security",
      "description": "Changes authentication, permissions, isolation, or sensitive data handling.",
      "owner": "author",
      "color": "d4c5f9"
    },
    {
      "name": "impact:persistence",
      "description": "Changes saved files, history, databases, storage formats, or recovery.",
      "owner": "author",
      "color": "d4c5f9"
    },
    {
      "name": "impact:performance",
      "description": "Changes a hot path or makes a performance claim requiring evidence.",
      "owner": "author",
      "color": "d4c5f9"
    },
    {
      "name": "impact:cross-platform",
      "description": "Changes OS-dependent filesystems, permissions, signals, terminals, or platform APIs.",
      "owner": "author",
      "color": "d4c5f9"
    },
    {
      "name": "auto-merge-candidate",
      "description": "Low-risk reviewed change with passing checks. Advisory; merge policy still applies.",
      "owner": "reviewer",
      "color": "0e8a16"
    },
    {
      "name": "manual-verification-required",
      "description": "Requires verification and a human merge decision: scope, draft, unreviewed changes, or CI gaps.",
      "owner": "reviewer",
      "color": "fbca04"
    },
    {
      "name": "run-ci",
      "description": "Run CI on draft pull requests. Apply manually; template selections cannot request CI.",
      "owner": "reviewer",
      "color": "0e8a16"
    }
  ]
}
