name: Playground PR previews
# A completion supplies a PR number only. The default branch rechecks eligibility.
# Only the disposable builder interprets candidate source and it receives no credentials.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Playground PR event]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      pr:
        type: string
        description: PR number (empty reconciles all eligible PRs)
permissions: {}
jobs:
  list:
    if: github.ref == 'refs/heads/master' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment: sanctuary-delivery
    permissions: {contents: read, pull-requests: read}
    outputs:
      numbers: ${{ steps.select.outputs.numbers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SANCTUARY_R2_BUCKET: ${{ vars.SANCTUARY_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ vars.R2_PUBLISH_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PUBLISH_SECRET }}
        run: python3 -m infra.control.publish list
  preview:
    needs: list
    if: needs.list.outputs.numbers != '[]'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pr: ${{ fromJSON(needs.list.outputs.numbers) }}
    # A local reusable workflow is resolved at the caller commit. The pinned actionlint accepts this spelling.
    uses: ./.github/workflows/sanctuary-preview-one.yml # zizmor: ignore[self-repository]
    with: {pr: "${{ matrix.pr }}"}
    permissions: {contents: read, pull-requests: read, statuses: write}
