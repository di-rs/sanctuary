name: Production database review
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: persistence-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  assessment:
    name: Production persistence risk assessment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: '0.13.0'
      - name: Check the contributor's assessment against the changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --locked --only-group pr-review python .github/scripts/persistence_review.py "$BASE_SHA" "$HEAD_SHA" "$GITHUB_EVENT_PATH"
