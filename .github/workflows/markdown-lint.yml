name: Markdown structure
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '**/*.md'
      - '**/*.markdown'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/markdown-lint.yml'
      - '!.agents/**'
      - '!.codex/**'
      - '!**/node_modules/**'
      - '!**/target/**'
      - '!**/dist/**'
      - '!**/vendor/**'
      - '!**/generated/**'
      - '!tools/cli-playground/src/cli_playground/static/**'
permissions:
  contents: read
concurrency:
  group: markdown-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    name: Markdown structure
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Check maintained files
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            if [[ -f "$file" && ! -L "$file" ]]; then
              files+=("./$file")
            fi
          done < <(git ls-files -z -- '*.md' '*.markdown' ':(exclude).agents/**' ':(exclude).codex/**' ':(exclude)**/node_modules/**' ':(exclude)**/target/**' ':(exclude)**/dist/**' ':(exclude)**/vendor/**' ':(exclude)**/generated/**' ':(exclude)tools/cli-playground/src/cli_playground/static/**')
          if (( ${#files[@]} )); then
            npx --yes markdownlint-cli2@0.22.0 --config .markdownlint-cli2.jsonc "${files[@]}"
          fi
