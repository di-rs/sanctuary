name: 🧪 Sanctuary browser integration

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Native acceptance suite
        type: choice
        default: all
        options: [all, dokku]

permissions:
  contents: read

concurrency:
  group: sanctuary-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: 🎭 Verify cli-playground with Boxie
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ github.job }}
      - name: 🛡️ Install signed gVisor and configure sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg openssh-server
          curl --fail --silent --show-error --location --max-time 60 https://gvisor.dev/archive.key \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          printf '%s\n' 'deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main' \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo runsc install -- --platform=systrap --fdlimit=4096
          sudo systemctl restart docker
          runsc --version
      - name: 🏗️ Build Boxie sandbox and native CLI
        run: |
          docker build -f packages/boxie/sandbox/Dockerfile -t boxie-sandbox:lifecycle .
          cargo build --release --package echor
      - name: 🐳 Build Boxie image
        run: |
          docker build -f packages/boxie/infra/Boxie.Dockerfile -t boxie:lifecycle .
      - name: 🐳 Build cli-playground image (Frontend and Backend)
        run: |
          docker build -f tools/cli-playground/infra/docker/CliPlayground.Dockerfile -t cli-playground:lifecycle .
      - name: 🟢 Set up Node.js and frontend tooling
        if: inputs.suite != 'dokku'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: tools/cli-playground/frontend
          node-version-file: .node-version
          version-file: package.json
          run-install: false
          cache: true
      - name: 📦 Install locked Python workspace dependencies
        run: |
          uv sync --all-packages
      - name: 🌐 Install frontend and Chromium dependencies
        if: inputs.suite != 'dokku'
        run: |
          pnpm --dir tools/cli-playground/frontend install
          pnpm --dir tools/cli-playground/frontend exec playwright install --with-deps chromium
      - name: 🎭 Run native lifecycle and browser tests
        if: inputs.suite != 'dokku'
        timeout-minutes: 20
        run: |
          uv run pytest -m integration packages/boxie/tests/integration/test_lifecycle.py tools/cli-playground/tests/test_native.py -vv --durations=10 -o faulthandler_timeout=120
      - name: Exercise production and two Dokku PR apps on this disposable runner
        timeout-minutes: 25
        run: |
          private=$(mktemp -d)
          ssh-keygen -q -t ed25519 -N '' -f "$private/key"
          printf '[127.0.0.1]:22222 %s\n' "$(< /etc/ssh/ssh_host_ed25519_key.pub)" > "$private/known_hosts"
          bash infra/environments/single-host/ssh-config.sh "$private" 127.0.0.1
          echo '  Port 22222' >> "$private/config"
          sudo install -d /run/sshd
          sudo install -m 0644 "$private/key.pub" /run/dokku-acceptance-key.pub
          sudo /usr/sbin/sshd -f /dev/null -h /etc/ssh/ssh_host_ed25519_key -p 22222 -o ListenAddress=127.0.0.1 \
            -o PidFile=/run/dokku-acceptance-sshd.pid -o AuthorizedKeysFile=/run/dokku-acceptance-key.pub \
            -o UsePAM=yes -o PermitRootLogin=prohibit-password -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
          sudo env PATH="$PATH" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" SANCTUARY_DISPOSABLE_DOKKU_HOST=1 \
            DOKKU_TEST_SSH_CONFIG="$private/config" .venv/bin/python -m pytest -m integration \
            tools/cli-playground/tests/test_dokku_native.py -s -v --tb=short
