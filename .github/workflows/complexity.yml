name: Function complexity advisory
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '**/*.rs'
      - '**/*.py'
      - '**/*.pyi'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.svelte'
      - '.jscpd.json'
      - '.github/workflows/complexity.yml'
      - '!.agents/**'
      - '!.codex/**'
      - '!**/node_modules/**'
      - '!**/target/**'
      - '!**/dist/**'
      - '!**/vendor/**'
      - '!**/generated/**'
      - '!**/__pycache__/**'
      - '!**/fixtures/**'
      - '!**/inputs/**'
      - '!**/expected/**'
      - '!tools/cli-playground/src/cli_playground/static/**'
permissions:
  contents: read
concurrency:
  group: complexity-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name != 'run-ci' && github.run_id || 'checks' }}
  cancel-in-progress: true
jobs:
  check:
    name: Function complexity advisory
    if: >-
      ${{
        (github.event.action != 'labeled' || github.event.label.name == 'run-ci') &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.0'
      - name: Report function metrics without failing on findings
        shell: bash
        run: |
          mkdir -p target/complexity
          files=()
          while IFS= read -r -d '' file; do
            case "/$file" in
              */node_modules/*|*/target/*|*/dist/*|*/vendor/*|*/generated/*|*/__pycache__/*|*/fixtures/*|*/inputs/*|*/expected/*|/.agents/*|/.codex/*|/tools/cli-playground/src/cli_playground/static/*) continue ;;
            esac
            case "$file" in
              *.rs|*.py|*.js|*.jsx|*.ts|*.tsx)
                if [[ -f "$file" && ! -L "$file" ]]; then files+=("./$file"); fi ;;
            esac
          done < <(git ls-files -z)
          if (( ${#files[@]} )); then
            uvx --from lizard==1.26.1 lizard -E NS --NS 4 -C 15 -T nloc=100 \
              --ignore_warnings -1 "${files[@]}" > target/complexity/functions.txt
          else
            echo 'No supported function source files present.' > target/complexity/functions.txt
          fi
          cat target/complexity/functions.txt
          echo 'Function metrics are advisory: CCN >15, nesting >4, and nonblank length >100 are review signals, not CI gates. Production and test code are included. No legacy-function baseline is enforced.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: hashFiles('tools/cli-playground/frontend/**/*.svelte') != ''
        with:
          node-version: '24'
      - name: Report Svelte file-level complexity
        if: hashFiles('tools/cli-playground/frontend/**/*.svelte') != ''
        run: >-
          npx --yes jscpd@5.4.3 tools/cli-playground/frontend --complexity --format svelte
          --reporters json,console --output target/complexity/svelte
      - name: Explain report scope
        run: >-
          echo 'See the complexity-report artifact for function metrics. Lizard does not analyze Svelte; when present, Svelte has a separate jscpd file-level report, not per-function nesting or length checks.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complexity-report
          path: target/complexity/
          if-no-files-found: error
          retention-days: 14
