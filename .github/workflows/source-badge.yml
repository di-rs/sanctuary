name: Source line-count badge
on:
  push:
    branches: [master]
    paths:
      - '**/*.rs'
      - '**/*.py'
      - '**/*.pyi'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.svelte'
      - '.github/workflows/source-badge.yml'
      - '!**/node_modules/**'
      - '!**/target/**'
      - '!**/dist/**'
      - '!**/vendor/**'
      - '!**/generated/**'
      - '!**/__pycache__/**'
      - '!**/fixtures/**'
      - '!**/inputs/**'
      - '!**/expected/**'
      - '!.agents/**'
      - '!.codex/**'
      - '!tools/cli-playground/src/cli_playground/static/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-badge
  cancel-in-progress: false
jobs:
  measure:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.0'
      - name: Install line counter
        run: sudo apt-get update && sudo apt-get install --yes cloc
      - name: Count maintained source and render badge
        shell: bash
        run: |
          mkdir -p badge
          git ls-files -z -- . ':(exclude)tools/cli-playground/src/cli_playground/static/**' | while IFS= read -r -d '' path; do
            if [[ -f "$path" && ! -L "$path" ]]; then
              printf '%s\n' "$path"
            fi
          done > "$RUNNER_TEMP/source-files.txt"
          cloc --list-file="$RUNNER_TEMP/source-files.txt" --fullpath --skip-uniqueness --json --quiet \
            --include-ext=rs,py,pyi,js,jsx,ts,tsx,svelte \
            --exclude-dir=node_modules,target,dist,vendor,generated,__pycache__,fixtures,inputs,expected,.agents,.codex \
            --report-file="$RUNNER_TEMP/source-lines.json"
          count=$(jq '(.SUM.code // 0) + (.SUM.comment // 0)' "$RUNNER_TEMP/source-lines.json")
          uvx --from anybadge==1.14.0 anybadge --label 'source nonblank lines' \
            --value "$count" --color '#374151' --file badge/loc.svg
          echo "Source nonblank lines (cloc code + comments): $count" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-badge
          path: badge/loc.svg
          retention-days: 1
  publish:
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No repository code is executed in this write-capable job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: source-badge
          path: badge
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const branch = 'chore/badges';
            try {
              await github.rest.git.getRef({...context.repo, ref: `heads/${branch}`});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...context.repo, ref: `refs/heads/${branch}`, sha: context.sha});
            }
            const content = fs.readFileSync('badge/loc.svg').toString('base64');
            let sha;
            try {
              const result = await github.rest.repos.getContent({...context.repo, path: 'loc.svg', ref: branch});
              if (result.data.content.replace(/\s/g, '') === content) return;
              sha = result.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo, branch, path: 'loc.svg', sha,
              message: '📊 Update source line-count badge',
              content
            });
