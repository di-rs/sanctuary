name: Verify Sanctuary deployment
on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/*playground*.yml'
      - '.github/workflows/sanctuary-*.yml'
      - '.github/workflows/boxie-release.yml'
      - 'packages/boxie/src/**'
      - 'tools/cli-playground/src/**'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with: {version: '0.13.0'}
      - run: uv run --locked --all-packages pytest -m '' infra/tests
  native:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with: {version: '0.13.0'}
      - name: Register gVisor on the disposable runner
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --batch --dearmor -o /usr/share/keyrings/gvisor.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor.gpg] https://storage.googleapis.com/gvisor/releases release main' | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y runsc
          sudo runsc install -- --platform=systrap --fdlimit=4096
          sudo systemctl restart docker
      - name: Build candidate application images
        run: |
          docker build -f infra/images/App.Dockerfile --target boxie --build-arg PACKAGE=boxie -t "sanctuary/boxie:$GITHUB_SHA" .
          docker build -f infra/images/App.Dockerfile --target playground --build-arg PACKAGE=cli-playground -t "sanctuary/playground:$GITHUB_SHA" .
          docker build -f packages/boxie/sandbox/Dockerfile -t "sanctuary/sandbox:$GITHUB_SHA" .
      - name: Compile and package the CLI release
        id: bundle
        run: bash infra/control/build.sh "$PWD" "$PWD" "$GITHUB_SHA" "$GITHUB_SHA" "$RUNNER_TEMP/bundle.zip"
      - name: Show compiler diagnostics on the disposable runner
        if: failure() && steps.bundle.outcome == 'failure'
        run: |
          if test -f "$RUNNER_TEMP/bundle-build.log"; then
            marker=$(cat /proc/sys/kernel/random/uuid)
            echo "::stop-commands::$marker"
            tail -c 6000 "$RUNNER_TEMP/bundle-build.log" | LC_ALL=C tr -cd '[:print:]\n'
            printf '\n::%s::\n' "$marker"
          fi
      - name: Apply production and preview releases on isolated networks
        run: |
          uv sync --locked --all-packages
          sudo "$PWD/.venv/bin/python" -m infra.tests.native "$RUNNER_TEMP/bundle.zip"
