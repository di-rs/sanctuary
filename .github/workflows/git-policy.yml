name: 📜 PR title policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  local-recordings:
    name: Local CLI recordings
    if: >-
      ${{ (github.event.action != 'labeled' || github.event.label.name == 'run-ci') &&
          (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.0'
      - name: Check the PR evidence for direct CLI changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pr-body.md"
          uv run --locked --no-dev --package cli-check cli-check check-pr \
            --base "$BASE_SHA" --body-file "$RUNNER_TEMP/pr-body.md"

  git-policy:
    if: >-
      ${{
        (github.event.action != 'labeled' || github.event.label.name == 'run-ci') &&
        (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci'))
      }}
    # This check name is required by branch protection; keep its context stable.
    name: git-policy${{ github.event.action == 'labeled' && github.event.label.name != 'run-ci' && ' (label metadata only)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🛠️ Install Git policy hooks
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: prek@0.5.5
          fallback: none
      - name: 📜 Load pinned Gitmoji policy
        env:
          # Pin the policy independently of the PR checkout. Update after review.
          POLICY_COMMIT: 9da5407f9a30c1b2ed1687ed09435c3936ac51ad
        run: |
          git fetch --no-tags origin "$POLICY_COMMIT"
          mkdir -p "$RUNNER_TEMP/git-policy"
          git show "$POLICY_COMMIT:prek.toml" > "$RUNNER_TEMP/git-policy/prek.toml"
      - name: ✅ Validate PR squash title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/COMMIT_EDITMSG"
          prek run --config "$RUNNER_TEMP/git-policy/prek.toml" require-pattern --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/COMMIT_EDITMSG"
