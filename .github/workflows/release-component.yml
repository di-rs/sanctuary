name: 🚀 Deploy Sanctuary component
'on':
  workflow_call:
    inputs:
      component: {type: string, required: true}
      environment: {type: string, required: true}
      source_sha: {type: string, required: true}
      source_attempt: {type: string, required: true}
      built_sha: {type: string, required: true}
      image: {type: string, required: true}
    secrets:
      DEPLOY_SSH_KEY: {required: true}
      DEPLOY_KNOWN_HOSTS: {required: true}
permissions: {}
jobs:
  deploy:
    name: 🚀 Deploy with Compose
    if: ${{ github.ref == 'refs/heads/master' && vars.DEPLOYMENT_ACCEPTANCE_PASSED == 'true' }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🔎 Require a complete workflow retry
        env:
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
        run: |
          if [[ -z $SOURCE_ATTEMPT || $SOURCE_ATTEMPT != "$GITHUB_RUN_ATTEMPT" ]]; then
            echo 'Use Re-run all jobs or start a new workflow run to select current master.' >&2
            exit 1
          fi
      - name: 📥 Check out the built source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: 🚀 Copy component files and run Compose
        env:
          COMPONENT: ${{ inputs.component }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILT_SHA: ${{ inputs.built_sha }}
          IMAGE: ${{ inputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ github.token }}
        run: bash infra/environments/single-host/release.sh "$COMPONENT"
