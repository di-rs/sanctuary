name: 🚀 Boxie Release
'on':
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: sanctuary-production
  queue: max
  cancel-in-progress: false
jobs:
  source:
    name: 📥 Select current master
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/select-production-source.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
  boxie:
    needs: source
    uses: ./.github/workflows/build-image.yml # zizmor: ignore[self-repository]
    with:
      component: boxie
      revision: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
  sandbox:
    needs: source
    uses: ./.github/workflows/build-image.yml # zizmor: ignore[self-repository]
    with:
      component: boxie-sandbox
      revision: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
  deploy-boxie:
    name: 🚀 Update Boxie with Compose
    needs: [source, boxie, sandbox]
    uses: ./.github/workflows/release-component.yml # zizmor: ignore[self-repository]
    with:
      component: boxie
      environment: boxie
      source_sha: ${{ needs.source.outputs.sha }}
      source_attempt: ${{ needs.source.outputs.attempt }}
      built_sha: ${{ needs.boxie.outputs.source_sha }}
      image: ${{ needs.boxie.outputs.image }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    permissions:
      contents: read
      packages: read

  deploy-sandbox:
    name: 🚀 Update Boxie Sandbox
    needs: [source, sandbox, deploy-boxie]
    uses: ./.github/workflows/release-component.yml # zizmor: ignore[self-repository]
    with:
      component: boxie-sandbox
      environment: boxie
      source_sha: ${{ needs.source.outputs.sha }}
      source_attempt: ${{ needs.source.outputs.attempt }}
      built_sha: ${{ needs.sandbox.outputs.source_sha }}
      image: ${{ needs.sandbox.outputs.image }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    permissions:
      contents: read
      packages: read
