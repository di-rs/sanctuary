name: Deploy Boxie
on:
  workflow_dispatch:
    inputs:
      rollback:
        type: string
        description: Previously published commit to restore (empty builds the default branch)
permissions: {contents: read}
jobs:
  boxie:
    # A local reusable workflow is resolved at the caller commit. The pinned actionlint accepts this spelling.
    uses: ./.github/workflows/sanctuary-release-component.yml # zizmor: ignore[self-repository]
    with:
      component: boxie
      rollback: ${{ inputs.rollback }}
