name: 🚀 Boxie Release
'on':
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: sanctuary-production
  queue: max
  cancel-in-progress: false
jobs:
  source:
    name: 📥 Select current master
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      attempt: ${{ steps.revision.outputs.attempt }}
    steps:
      - name: 📥 Check out current master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false
      - name: 🔎 Record the source commit
        id: revision
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  boxie:
    needs: source
    uses: ./.github/workflows/build-image.yml # zizmor: ignore[self-repository]
    with:
      component: boxie
      revision: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
  sandbox:
    needs: source
    uses: ./.github/workflows/build-image.yml # zizmor: ignore[self-repository]
    with:
      component: boxie-sandbox
      revision: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
  deploy-boxie:
    name: 🚀 Update Boxie with Compose
    needs: [source, boxie, sandbox]
    uses: ./.github/workflows/release-component.yml # zizmor: ignore[self-repository]
    with:
      component: boxie
      environment: boxie
      source_sha: ${{ needs.source.outputs.sha }}
      source_attempt: ${{ needs.source.outputs.attempt }}
      built_sha: ${{ needs.boxie.outputs.source_sha }}
      image: ${{ needs.boxie.outputs.image }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    permissions:
      contents: read
      packages: read

  deploy-sandbox:
    name: 🚀 Update Boxie Sandbox
    needs: [source, sandbox, deploy-boxie]
    uses: ./.github/workflows/release-component.yml # zizmor: ignore[self-repository]
    with:
      component: boxie-sandbox
      environment: boxie
      source_sha: ${{ needs.source.outputs.sha }}
      source_attempt: ${{ needs.source.outputs.attempt }}
      built_sha: ${{ needs.sandbox.outputs.source_sha }}
      image: ${{ needs.sandbox.outputs.image }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    permissions:
      contents: read
      packages: read
