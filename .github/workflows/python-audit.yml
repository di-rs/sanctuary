name: Python dependency audit
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '**/pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/scripts/dependency_audit.py'
      - '.github/workflows/python-audit.yml'
permissions:
  contents: read
concurrency:
  group: python-audit-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'labeled' && github.event.label.name != 'run-ci' && github.run_id || 'checks' }}
  cancel-in-progress: true
jobs:
  audit:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        ((github.event.action != 'labeled' || github.event.label.name == 'run-ci') &&
         (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.0'
      - name: Audit applicable packages across all locked Python dependency groups
        shell: bash
        run: |
          if ! uvx --from pip-audit==2.10.1 python .github/scripts/dependency_audit.py python; then
            if [[ ! -s "$GITHUB_STEP_SUMMARY" ]]; then
              echo 'Python dependency audit — Incomplete. The audit runner could not start.' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
