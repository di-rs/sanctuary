name: YAML lint
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.yamllint.yml'
      - '.github/workflows/yaml-lint.yml'
      - '!.agents/**'
      - '!.codex/**'
      - '!**/node_modules/**'
      - '!**/target/**'
      - '!**/dist/**'
      - '!**/vendor/**'
      - '!**/generated/**'
      - '!tools/cli-playground/src/cli_playground/static/**'
permissions:
  contents: read
concurrency:
  group: yaml-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    name: YAML lint
    if: ${{ !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.13.0'
      - name: Check maintained files
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            if [[ -f "$file" && ! -L "$file" ]]; then
              files+=("./$file")
            fi
          done < <(git ls-files -z -- '*.yml' '*.yaml' ':(exclude).agents/**' ':(exclude).codex/**' ':(exclude)**/node_modules/**' ':(exclude)**/target/**' ':(exclude)**/dist/**' ':(exclude)**/vendor/**' ':(exclude)**/generated/**' ':(exclude)tools/cli-playground/src/cli_playground/static/**')
          if (( ${#files[@]} )); then
            uvx --from yamllint==1.38.0 yamllint -c .yamllint.yml -- "${files[@]}"
          fi
