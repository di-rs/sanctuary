name: Frontend dependency audit
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'tools/cli-playground/frontend/package.json'
      - 'tools/cli-playground/frontend/pnpm-lock.yaml'
      - 'tools/cli-playground/frontend/pnpm-workspace.yaml'
      - 'tools/cli-playground/frontend/.node-version'
      - '.github/scripts/dependency_audit.py'
      - '.github/workflows/frontend-audit.yml'
permissions:
  contents: read
concurrency:
  group: frontend-audit-${{ github.event.pull_request.number || github.sha }}-${{ github.event.action == 'labeled' && github.event.label.name != 'run-ci' && github.run_id || 'checks' }}
  cancel-in-progress: true
jobs:
  audit:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        ((github.event.action != 'labeled' || github.event.label.name == 'run-ci') &&
         (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'run-ci')))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        if: hashFiles('tools/cli-playground/frontend/pnpm-lock.yaml') != ''
        with:
          working-directory: tools/cli-playground/frontend
          node-version-file: .node-version
          version-file: package.json
          run-install: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.0'
      - name: Audit locked production and development dependencies
        shell: bash
        run: |
          if ! uv run --locked --only-group pr-review python .github/scripts/dependency_audit.py frontend; then
            if [[ ! -s "$GITHUB_STEP_SUMMARY" ]]; then
              echo 'Frontend dependency audit — Incomplete. The audit runner could not start.' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
