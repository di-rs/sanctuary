name: 🌱 Playground feature environments

# Only trusted controller code runs on the runner. BuildKit fetches the exact PR
# revision inside its isolated builder and executes the default branch's Dockerfile.
on: # zizmor: ignore[dangerous-triggers]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to reconcile
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, edited, closed]

permissions: {}
concurrency:
  group: playground-feature-${{ github.event.number || inputs.pr }}
  queue: max
  cancel-in-progress: false

env:
  FEATURE_PR: ${{ github.event.number || inputs.pr }}

jobs:
  select:
    if: github.ref == 'refs/heads/master' && (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    outputs:
      operation: ${{ steps.current.outputs.operation }}
      sha: ${{ steps.current.outputs.sha }}
      deployment: ${{ steps.current.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          FEATURE_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/cli-playground/feature_ci.py

  reconcile:
    needs: select
    if: ${{ needs.select.outputs.operation != 'skip' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: cli-playground
      deployment: false
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    env:
      FEATURE_OPERATION: ${{ needs.select.outputs.operation }}
      FEATURE_SHA: ${{ needs.select.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create isolated image builder
        if: env.FEATURE_OPERATION == 'deploy'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          cache-binary: false
          buildkitd-flags: --log-format=json
      - name: Build branch frontend and backend
        if: env.FEATURE_OPERATION == 'deploy'
        run: |
          [[ $FEATURE_PR =~ ^[1-9][0-9]{0,9}$ && $FEATURE_SHA =~ ^[0-9a-f]{40}$ ]]
          docker buildx build --load --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$FEATURE_SHA" \
            --tag "localhost/sanctuary-playground-pr-$FEATURE_PR:$FEATURE_SHA" \
            --file - "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git#$FEATURE_SHA" \
            < tools/cli-playground/infra/docker/CliPlayground.Dockerfile
      - name: Build representative terminal input from trusted source
        if: env.FEATURE_OPERATION == 'deploy'
        run: |
          cargo build --locked --release -p echor
          bash tools/cli-playground/infra/scripts/seed.sh "$FEATURE_SHA" target/release/echor "$RUNNER_TEMP/seed.zip"
      - name: Reconcile the current PR on the shared host
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_DEPLOYMENT: ${{ needs.select.outputs.deployment }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          private=$(mktemp -d); trap 'rm -rf "$private"' EXIT
          bash infra/environments/single-host/ssh-config.sh "$private"
          feature() { ssh -F "$private/config" deployment bash /opt/sanctuary/cli-playground/scripts/feature.sh "$@"; }
          ghapi="repos/$GITHUB_REPOSITORY/deployments"
          [[ $FEATURE_PR =~ ^[1-9][0-9]{0,9}$ && $FEATURE_SHA =~ ^[a-f0-9]{40}$ ]]
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$FEATURE_PR" --jq '[.head.sha,.state,.base.ref]|join(" ")')
          if [[ ${state%% *} != "$FEATURE_SHA" ]]; then exit 0; fi
          if [[ $FEATURE_OPERATION == remove ]]; then
            # Re-evaluate a reopened PR or reverted change against its current files.
            GITHUB_OUTPUT="$private/current" python3 tools/cli-playground/feature_ci.py
            if ! grep -qx operation=remove "$private/current"; then exit 0; fi
            feature remove "$FEATURE_PR"
            gh api "$ghapi/$PREVIOUS_DEPLOYMENT/statuses" -f state=inactive --silent
          elif [[ $state == "$FEATURE_SHA open master" ]]; then
            tag="localhost/sanctuary-playground-pr-$FEATURE_PR:$FEATURE_SHA"
            (( $(docker image inspect --format '{{.Size}}' "$tag") <= 1073741824 ))
            deployment=$(jq -n --arg sha "$FEATURE_SHA" --arg env "cli-playground/feature-pr-$FEATURE_PR" \
              '{ref:$sha,environment:$env,auto_merge:false,required_contexts:[],transient_environment:true,production_environment:false}' \
              | gh api "$ghapi" --input - --jq .id)
            trap 'gh api "$ghapi/$deployment/statuses" -f state=failure --silent' ERR
            docker save "$tag" | feature deploy "$FEATURE_PR" "$FEATURE_SHA"
            url=$(feature publish "$FEATURE_PR" "$FEATURE_SHA" < "$RUNNER_TEMP/seed.zip")
            gh api "$ghapi/$deployment/statuses" -f state=success -f environment_url="$url" --silent
            printf '[Open Playground](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          fi
