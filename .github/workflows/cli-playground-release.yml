name: 🚀 cli-playground Release
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sanctuary-production
  queue: max
  cancel-in-progress: false
jobs:
  deploy-backend:
    if: github.ref == 'refs/heads/master' && vars.DEPLOYMENT_ACCEPTANCE_PASSED == 'true'
    environment: cli-playground
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: master
          persist-credentials: false
      - name: Build and deploy Playground over SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          private=$(mktemp -d)
          trap 'rm -rf "$private"' EXIT
          bash infra/environments/single-host/ssh-config.sh "$private"
          tag=$(bash infra/environments/single-host/build-image.sh cli-playground)
          docker save "$tag" | ssh -F "$private/config" deployment bash /opt/sanctuary/cli-playground/scripts/deploy.sh "$tag"
