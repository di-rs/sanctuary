name: 🚀 cli-playground Release
'on':
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: sanctuary-production
  queue: max
  cancel-in-progress: false
jobs:
  source:
    name: 📥 Select current master
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/select-production-source.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
  backend:
    needs: source
    uses: ./.github/workflows/build-image.yml # zizmor: ignore[self-repository]
    with:
      component: cli-playground
      revision: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
      packages: write
  deploy-backend:
    name: 🚀 Update cli-playground Backend with Compose
    needs: [source, backend]
    uses: ./.github/workflows/release-component.yml # zizmor: ignore[self-repository]
    with:
      component: cli-playground
      environment: cli-playground
      source_sha: ${{ needs.source.outputs.sha }}
      source_attempt: ${{ needs.source.outputs.attempt }}
      built_sha: ${{ needs.backend.outputs.source_sha }}
      image: ${{ needs.backend.outputs.image }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    permissions:
      contents: read
      packages: read
