# dorny/paths-filter rules. Matched jobs retain their full workspace test suites.
config:
  - '.github/ci-paths.yml'
  - '.github/workflows/pull-request-check.yml'
  - 'prek.toml'

rust:
  - '**/*.rs'
  - '**/Cargo.{toml,lock}'
  - 'rust-toolchain*'
  - '.cargo/**'
  - '.config/nextest.toml'
  - '{clippy,deny,rustfmt}.toml'
  - '.rustfmt.toml'
  # Include fixtures, test catalogs, embedded assets, and build inputs.
  - 'buildins/**'
  - 'utils/**'
  - 'packages/{biggie,kara,parsu,shish}/**'
  - 'tools/cli-testing/**'

python:
  - '**/*.{py,pyi}'
  - '**/pyproject.toml'
  - 'uv.lock'
  - '.python-version'
  - '{ruff,.ruff,mypy}.toml'
  - '{mypy,pytest}.ini'
  - 'setup.cfg'
  - '**/conftest.py'
  - 'tools/{cli-bench,cli-check}/**/!(*.md|*.markdown)'
  # Tests read deployment scripts, Compose manifests, and workflow definitions.
  - 'infra/**/!(*.md|*.markdown)'
  - 'packages/boxie/infra/**/!(*.md|*.markdown)'
  - 'tools/cli-playground/infra/**/!(*.md|*.markdown)'
  - '.github/workflows/**'
  - 'packages/boxie/tests/**'
  - 'tools/cli-playground/tests/**'

frontend:
  - 'tools/cli-playground/frontend/**/!(*.md|*.markdown)'
  # This job also owns packaging, database lifecycle, and browser integration tests.
  - 'tools/cli-playground/{src,tests,infra}/**/!(*.md|*.markdown)'
  - 'packages/boxie/{src,tests,infra}/**/!(*.md|*.markdown)'
  - '**/pyproject.toml'
  - 'uv.lock'
  - '.python-version'
  - 'conftest.py'

# Link checks and repository policy remain independent of these filters:
# deleting any linked file or changing benchmark data must still be checked.
actions:
  - '.github/**'
  - '**/action.{yml,yaml}'
