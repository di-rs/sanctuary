[project]
name = "local-dev"
version = "0.1.0"
description = "Check Sanctuary CLIs, record demos and run the local playground"
requires-python = ">=3.15"
dependencies = ["cli-check"]

[project.scripts]
sanctuary-dev = "local_dev.command:main"
local-dev = "local_dev.command:main"

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"
