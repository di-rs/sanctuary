# Backend and proxy are independently operated; activation requires acceptance gates.
name: ${CLI_PLAYGROUND_PROJECT_NAME:-cli-playground}
services:
  dokku:
    build:
      context: ./docker
      dockerfile: Dokku.Dockerfile
    container_name: sanctuary-dokku
    networks: [proxy, apps]
    restart: unless-stopped
    environment:
      DOKKU_HOSTNAME: ${CLI_PLAYGROUND_DOMAIN}
      DOKKU_HOST_ROOT: /srv/sanctuary/dokku/home/dokku
      DOKKU_LIB_HOST_ROOT: /srv/sanctuary/dokku/var/lib/dokku
    volumes:
    - /srv/sanctuary/dokku:/mnt/dokku
    - /var/run/docker.sock:/var/run/docker.sock
  proxy:
    image: traefik:v3.7.19
    command:
    - --global.checknewversion=false
    - --global.sendanonymoususage=false
    - --ping=true
    - --entrypoints.web.address=:80
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.web.http.redirections.entrypoint.scheme=https
    - --entrypoints.websecure.address=:443
    - --providers.file.filename=/etc/traefik/routes.yml
    - --certificatesresolvers.preview.acme.email=${ACME_EMAIL:?Set the certificate
      contact email}
    - --certificatesresolvers.preview.acme.storage=/certificates/acme.json
    - --certificatesresolvers.preview.acme.dnschallenge.provider=cloudflare
    # Let public DNS caches catch up before the CA validates the wildcard challenge.
    - --certificatesresolvers.preview.acme.dnschallenge.propagation.delaybeforechecks=120s
    environment:
      CLI_PLAYGROUND_DOMAIN: ${CLI_PLAYGROUND_DOMAIN}
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:?Set the certificate DNS token}
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./proxy/routes.yml:/etc/traefik/routes.yml:ro
    - certificates:/certificates
    healthcheck:
      test:
      - CMD
      - traefik
      - healthcheck
      - --ping
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    networks: [proxy]
volumes:
  certificates:
    external: true
    name: cli-playground-certificates
networks:
  apps:
    external: true
    name: playground-apps
  proxy: {}
