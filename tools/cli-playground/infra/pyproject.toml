[project]
name = "cli-playground-infra"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["host-infra", "cli-playground", "boxie-infra", "pydantic>=2.14,<3", "pyyaml>=6.0.3", "pulumi==3.276.0", "pulumi-cloudflare==6.24.0", "pulumi-hcloud==1.43.4", "pulumi-tls==5.6.3"]

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "cli_playground_infra"
