schema = 1
binary = "uniqr"
reference = "uniq"

[fixtures]
empty = "empty.txt"
one = "one.txt"
two = "two.txt"
three = "three.txt"
skip = "skip.txt"
t1 = "t1.txt"
t2 = "t2.txt"
t3 = "t3.txt"
t4 = "t4.txt"
t5 = "t5.txt"
t6 = "t6.txt"

[references.uniq]
program = "/usr/bin/uniq"
platform = "macos"

[[cases]]
name = "empty"
args = [{ fixture = "empty" }]
expect = { exit = 0 }

[[cases]]
name = "empty_count"
args = ["-c", { fixture = "empty" }]
expect = { exit = 0 }

[[cases]]
name = "empty_stdin"
args = []
stdin = { mode = "pipe", files = ["empty"] }
expect = { exit = 0 }

[[cases]]
name = "empty_stdin_count"
args = ["-c"]
stdin = { mode = "pipe", files = ["empty"] }
expect = { exit = 0 }

