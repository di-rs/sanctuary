[[cases]]
name = "count-matches"
args = ["--insensitive", "--recursive", "--count", "--verbose", "hello", "welcome.txt"]

[[cases]]
name = "inverted-match"
args = ["--invert-match", "--quiet", "ERROR", "app.log"]

[[cases]]
name = "anchored-matches"
args = ["^alpha$"]
stdin = "alpha\nbeta\nalpha\n"
