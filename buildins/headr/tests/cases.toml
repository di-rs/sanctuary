schema = 1
binary = "headr"
checks = ["help"]
reference = "head"

[fixtures]
empty = "empty.txt"
one = "one.txt"
two = "two.txt"
three = "three.txt"
twelve = "twelve.txt"

[references.head]
program = "/usr/bin/head"
platform = "macos"

[[cases]]
name = "empty"
args = [{ fixture = "empty" }]

[[cases]]
name = "empty_n2"
args = ["-n", "2", { fixture = "empty" }]

[[cases]]
name = "empty_n4"
args = ["-n", "4", { fixture = "empty" }]

[[cases]]
name = "empty_c2"
args = ["-c", "2", { fixture = "empty" }]

[[cases]]
name = "empty_c4"
args = ["-c", "4", { fixture = "empty" }]

[[cases]]
name = "one"
args = [{ fixture = "one" }]

[[cases]]
name = "one_n2"
args = ["-n", "2", { fixture = "one" }]

[[cases]]
name = "one_n4"
args = ["-n", "4", { fixture = "one" }]

[[cases]]
name = "one_c1"
args = ["-c", "1", { fixture = "one" }]
adapt = { expected_stdout = "utf8-lossy", reason = "headr replaces incomplete UTF-8 sequences; BSD head emits raw bytes." }

[[cases]]
name = "one_c2"
args = ["-c", "2", { fixture = "one" }]

[[cases]]
name = "one_c4"
args = ["-c", "4", { fixture = "one" }]

[[cases]]
name = "one_stdin"
args = []
stdin = { mode = "pipe", files = ["one"] }
expect = { stdout_file = "one.out" }

[[cases]]
name = "one_n2_stdin"
args = ["-n", "2"]
stdin = { mode = "pipe", files = ["one"] }
expect = { stdout_file = "one_n2.out" }

[[cases]]
name = "one_n4_stdin"
args = ["-n", "4"]
stdin = { mode = "pipe", files = ["one"] }
expect = { stdout_file = "one_n4.out" }

[[cases]]
name = "one_c1_stdin"
args = ["-c", "1"]
stdin = { mode = "pipe", files = ["one"] }
expect = { stdout_file = "one_c1.out" }
adapt = { expected_stdout = "utf8-lossy", reason = "headr replaces incomplete UTF-8 sequences; BSD head emits raw bytes." }

[[cases]]
name = "one_c2_stdin"
args = ["-c", "2"]
stdin = { mode = "pipe", files = ["one"] }
expect = { stdout_file = "one_c2.out" }

[[cases]]
name = "one_c4_stdin"
args = ["-c", "4"]
stdin = { mode = "pipe", files = ["one"] }
