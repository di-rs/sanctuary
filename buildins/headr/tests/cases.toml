[[cases]]
name = "multiple_files"
args = ["./tests/inputs/empty.txt", "./tests/inputs/one.txt", "./tests/inputs/two.txt", "./tests/inputs/three.txt", "./tests/inputs/twelve.txt"]
inputs = ["empty", "one", "two", "three", "twelve"]

[[cases]]
name = "multiple_files_n2"
args = ["-n", "2", "./tests/inputs/empty.txt", "./tests/inputs/one.txt", "./tests/inputs/two.txt", "./tests/inputs/three.txt", "./tests/inputs/twelve.txt"]
inputs = ["empty", "one", "two", "three", "twelve"]

[[cases]]
name = "multiple_files_n4"
args = ["-n", "4", "./tests/inputs/empty.txt", "./tests/inputs/one.txt", "./tests/inputs/two.txt", "./tests/inputs/three.txt", "./tests/inputs/twelve.txt"]
inputs = ["empty", "one", "two", "three", "twelve"]

[[cases]]
name = "multiple_files_c1"
args = ["-c", "1", "./tests/inputs/empty.txt", "./tests/inputs/one.txt", "./tests/inputs/two.txt", "./tests/inputs/three.txt", "./tests/inputs/twelve.txt"]
inputs = ["empty", "one", "two", "three", "twelve"]
adapt = { expected_stdout = "utf8-lossy", reason = "headr replaces incomplete UTF-8 sequences; BSD head emits raw bytes." }

[[cases]]
name = "multiple_files_c2"
args = ["-c", "2", "./tests/inputs/empty.txt", "./tests/inputs/one.txt", "./tests/inputs/two.txt", "./tests/inputs/three.txt", "./tests/inputs/twelve.txt"]
inputs = ["empty", "one", "two", "three", "twelve"]

[[cases]]
name = "multiple_files_c4"
args = ["-c", "4", "./tests/inputs/empty.txt", "./tests/inputs/one.txt", "./tests/inputs/two.txt", "./tests/inputs/three.txt", "./tests/inputs/twelve.txt"]
inputs = ["empty", "one", "two", "three", "twelve"]

[[cases]]
name = "reference_empty_txt_c1"
args = ["-c", "1", { fixture = "empty" }]

[[cases]]
name = "reference_three_txt_c1"
args = ["-c", "1", { fixture = "three" }]

[[cases]]
name = "reference_twelve_txt_c1"
args = ["-c", "1", { fixture = "twelve" }]

[[cases]]
name = "reference_two_txt_c1"
args = ["-c", "1", { fixture = "two" }]

[[cases]]
name = "rejects_unknown_flag"
args = ["--unknown", "1"]
origin = { manual = "Only declared options are accepted; unknown flags are argument errors." }
expect = { exit = 2, stdout = "", stderr_contains = "unexpected argument '--unknown'" }

[[cases]]
name = "rejects_nonnumeric_bytes"
args = ["-c", "invalid", { fixture = "empty" }]
origin = { manual = "The bytes count must be numeric." }
expect = { exit = 2, stdout = "", stderr_contains = "invalid digit found in string" }

[[cases]]
name = "rejects_nonnumeric_lines"
args = ["-n", "invalid", { fixture = "empty" }]
origin = { manual = "The lines count must be numeric." }
expect = { exit = 2, stdout = "", stderr_contains = "invalid digit found in string" }

[[cases]]
name = "rejects_lines_with_bytes"
args = ["-n", "1", "-c", "2"]
origin = { manual = "Line and byte limits are mutually exclusive." }
expect = { exit = 2, stdout = "", stderr_contains = "cannot be used with" }

[[cases]]
name = "rejects_zero_bytes"
args = ["-c", "0"]
origin = { manual = "The bytes count must be positive." }
expect = { exit = 2, stdout = "", stderr_contains = "invalid value '0'" }

[[cases]]
name = "rejects_zero_lines"
args = ["-n", "0"]
origin = { manual = "The lines count must be positive." }
expect = { exit = 2, stdout = "", stderr_contains = "invalid value '0'" }
