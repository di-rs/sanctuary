schema = 1
binary = "cutr"
reference = "cut"

[fixtures]
books = "books.tsv"
movies_csv = "movies1.csv"
movies_tsv = "movies1.tsv"

[references.cut]
program = "/usr/bin/cut"
platform = "macos"
env = { LC_ALL = "en_US.UTF-8" }

[[cases]]
name = "tsv_f1"
args = ["-f", "1", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_f2"
args = ["-f", "2", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_f3"
args = ["-f", "3", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_f1_2"
args = ["-f", "1-2", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_f2_3"
args = ["-f", "2-3", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_f1_3"
args = ["-f", "1-3", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "csv_f1"
args = ["-f", "1", "-d", ",", { fixture = "movies_csv" }]
expect = { exit = 0 }

[[cases]]
name = "csv_f2"
args = ["-f", "2", "-d", ",", { fixture = "movies_csv" }]
expect = { exit = 0 }

[[cases]]
name = "csv_f3"
args = ["-f", "3", "-d", ",", { fixture = "movies_csv" }]
expect = { exit = 0 }

[[cases]]
name = "csv_f1_2"
args = ["-f", "1-2", "-d", ",", { fixture = "movies_csv" }]
expect = { exit = 0 }

[[cases]]
name = "csv_f2_3"
args = ["-f", "2-3", "-d", ",", { fixture = "movies_csv" }]
expect = { exit = 0 }

[[cases]]
name = "csv_f1_3"
args = ["-f", "1-3", "-d", ",", { fixture = "movies_csv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_b1"
args = ["-b", "1", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_b2"
args = ["-b", "2", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_b8"
args = ["-b", "8", { fixture = "movies_tsv" }]
expect = { exit = 0 }
adapt = { expected_stdout = "utf8-lossy", reason = "cutr replaces incomplete UTF-8 sequences; BSD cut emits raw bytes." }

[[cases]]
name = "tsv_b1_2"
args = ["-b", "1-2", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_b2_3"
args = ["-b", "2-3", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_b1_8"
execution = "rust"
args = ["-b", "1-8", { fixture = "movies_tsv" }]
origin = { reason = "BSD cut emits raw bytes; the Rust test adapts incomplete UTF-8 in the expectation." }
expect = { exit = 0 }

[[cases]]
name = "tsv_c1"
args = ["-c", "1", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_c2"
args = ["-c", "2", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_c8"
args = ["-c", "8", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_c1_2"
args = ["-c", "1-2", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_c2_3"
args = ["-c", "2-3", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "tsv_c1_8"
args = ["-c", "1-8", { fixture = "movies_tsv" }]
expect = { exit = 0 }

[[cases]]
name = "repeated_value"
args = [{ fixture = "books" }, "-c", "1,1"]
origin = { manual = "Duplicate positions intentionally repeat characters: AA, ÉÉ, SS, JJ. BSD cut deduplicates selections." }
expect = { exit = 0 }
