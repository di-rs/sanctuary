origin = { args = ["-b", "8", { fixture = "movies_tsv" }], reason = "Use the BSD reference option spelling and place options before file operands." }
expect = { exit = 0 }
adapt = { expected_stdout = "utf8-lossy", reason = "cutr replaces incomplete UTF-8 sequences; BSD cut emits raw bytes." }

[[cases]]
name = "tsv_b1_2"
args = [{ fixture = "movies_tsv" }, "-b", "1-2"]
