execution = "rust"
args = [{ fixture = "movies_tsv" }, "-b", "1-8"]
origin = { args = ["-b", "1-8", { fixture = "movies_tsv" }], reason = "BSD cut emits raw bytes; the Rust test adapts incomplete UTF-8 in the expectation. Options precede operands for BSD cut." }
expect = { exit = 0 }

