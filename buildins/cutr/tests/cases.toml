schema = 2
binary = "cutr"
reference = "cut"

[fixtures]
books = "books.tsv"
movies_csv = "movies1.csv"
movies_tsv = "movies1.tsv"

[references.cut]
program = "/usr/bin/cut"
platform = "macos"
env = { LC_ALL = "en_US.UTF-8" }

[[cases]]
name = "tsv_f1"
args = [{ fixture = "movies_tsv" }, "-f", "1"]
origin = { args = ["-f", "1", { fixture = "movies_tsv" }], reason = "Use the BSD reference option spelling and place options before file operands." }
expect = { exit = 0 }

[[cases]]
name = "tsv_f2"
args = [{ fixture = "movies_tsv" }, "-f", "2"]
origin = { args = ["-f", "2", { fixture = "movies_tsv" }], reason = "Use the BSD reference option spelling and place options before file operands." }
