schema = 1
binary = "tailr"
reference = "tail"

[fixtures]
empty = "empty.txt"
one = "one.txt"
two = "two.txt"
three = "three.txt"
twelve = "twelve.txt"

[references.tail]
program = "/usr/bin/tail"
platform = "macos"

[[cases]]
name = "empty"
args = [{ fixture = "empty" }]
expect = { exit = 0 }

[[cases]]
name = "empty_n0"
args = ["-n", "0", { fixture = "empty" }]
expect = { exit = 0 }

[[cases]]
name = "empty_n1"
args = ["-n", "1", { fixture = "empty" }]
expect = { exit = 0 }

[[cases]]
name = "empty_n_minus_1"
args = ["-n=-1", { fixture = "empty" }]
origin = { args = ["-n", "-1", { fixture = "empty" }], reason = "BSD tail accepts the signed count as a separate option argument." }
expect = { exit = 0, stdout_file = "empty_n1.out" }

