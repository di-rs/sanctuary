schema = 1
binary = "mkdirr"
checks = ["help"]

[[cases]]
name = "creates_single_directory"
execution = "rust"
args = ["new"]
origin = { manual = "POSIX mkdir creates the requested directory silently; the native body verifies the filesystem result." }
expect = { stdout = "" }

[[cases]]
name = "requires_operands"
args = []
origin = { manual = "Directory creation requires at least one directory operand." }
expect = { exit = 2, stdout = "", stderr_contains = "required arguments were not provided" }
