schema = 1
binary = "catr"
reference = "cat"

[fixtures]
empty = "empty.txt"
fox = "fox.txt"
multispaces = "spiders-multispaces.txt"
spiders = "spiders.txt"
bustle = "the-bustle.txt"

[references.cat]
program = "/bin/cat"
platform = "macos"

[[cases]]
name = "bustle_stdin"
args = ["-"]
stdin = { mode = "pipe", files = ["bustle"] }
expect = { exit = 0 }

[[cases]]
name = "bustle_stdin_n"
args = ["-n", "-"]
stdin = { mode = "pipe", files = ["bustle"] }
expect = { exit = 0 }

[[cases]]
name = "bustle_stdin_b"
args = ["-b", "-"]
stdin = { mode = "pipe", files = ["bustle"] }
expect = { exit = 0 }

[[cases]]
name = "empty"
args = [{ fixture = "empty" }]
expect = { exit = 0 }

[[cases]]
name = "empty_n"
args = ["-n", { fixture = "empty" }]
expect = { exit = 0 }

[[cases]]
name = "empty_b"
args = ["-b", { fixture = "empty" }]
expect = { exit = 0 }

[[cases]]
name = "fox"
args = [{ fixture = "fox" }]
expect = { exit = 0 }

[[cases]]
name = "fox_n"
args = ["-n", { fixture = "fox" }]
expect = { exit = 0 }

[[cases]]
name = "fox_b"
args = ["-b", { fixture = "fox" }]
expect = { exit = 0 }

[[cases]]
name = "spiders"
args = [{ fixture = "spiders" }]
expect = { exit = 0 }

[[cases]]
name = "spiders_n"
args = ["-n", { fixture = "spiders" }]
expect = { exit = 0 }

[[cases]]
name = "spiders_b"
args = ["-b", { fixture = "spiders" }]
expect = { exit = 0 }

[[cases]]
name = "bustle"
args = [{ fixture = "bustle" }]
expect = { exit = 0 }

[[cases]]
name = "bustle_n"
args = ["-n", { fixture = "bustle" }]
expect = { exit = 0 }

[[cases]]
name = "bustle_b"
args = ["-b", { fixture = "bustle" }]
expect = { exit = 0 }

[[cases]]
name = "all"
args = [{ fixture = "fox" }, { fixture = "spiders" }, { fixture = "bustle" }]
expect = { exit = 0 }

[[cases]]
name = "all_n"
args = [{ fixture = "fox" }, { fixture = "spiders" }, { fixture = "bustle" }, "-n"]
origin = { args = ["-n", { fixture = "fox" }, { fixture = "spiders" }, { fixture = "bustle" }], reason = "Use the BSD reference option spelling and place options before file operands." }
expect = { exit = 0 }

[[cases]]
name = "all_b"
args = [{ fixture = "fox" }, { fixture = "spiders" }, { fixture = "bustle" }, "-b"]
origin = { args = ["-b", { fixture = "fox" }, { fixture = "spiders" }, { fixture = "bustle" }], reason = "Use the BSD reference option spelling and place options before file operands." }
expect = { exit = 0 }

[[cases]]
name = "mutipspaces"
args = [{ fixture = "multispaces" }]
expect = { exit = 0 }

[[cases]]
name = "mutipspaces_s"
args = [{ fixture = "multispaces" }, "-s"]
origin = { args = ["-s", { fixture = "multispaces" }], reason = "Use the BSD reference option spelling and place options before file operands." }
expect = { exit = 0 }

[[cases]]
name = "mutipspaces_s_n"
args = [{ fixture = "multispaces" }, "-s", "-n"]
origin = { args = ["-s", "-n", { fixture = "multispaces" }], reason = "Use the BSD reference option spelling and place options before file operands." }
expect = { exit = 0 }

[[cases]]
name = "mutipspaces_s_b"
args = [{ fixture = "multispaces" }, "-s", "-b"]
origin = { args = ["-s", "-b", { fixture = "multispaces" }], reason = "Use the BSD reference option spelling and place options before file operands." }
expect = { exit = 0 }

[[cases]]
name = "bustle_u"
args = [{ fixture = "bustle" }, "-u"]
origin = { args = ["-u", { fixture = "bustle" }], reason = "Use the BSD reference option spelling and place options before file operands." }
expect = { exit = 0, stdout_file = "bustle.out" }
