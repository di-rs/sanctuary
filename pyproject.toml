[project]
name = "sanctuary-tools"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "cli-bench",
    "cli-check",
    "local-dev",
    "cli-record",
    "sanctuary-dev",
    "githubkit>=0.17.1,<0.18",
    "httpx",
    "anyio",
    "pydantic>=2.14.4,<3",
]

[dependency-groups]
pr-review = ["markdown-it-py>=4,<5", "pyyaml>=6.0.3"]
dev = [
    "boxie-test-support",
    "mypy",
    "pulumi==3.276.0",
    "pulumi-cloudflare==6.24.0",
    "pulumi-hcloud==1.43.4",
    "pulumi-tls==5.6.3",
    "pytest>=9.2.0",
    { include-group = "pr-review" },
    "ruff",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
package = false
required-version = ">=0.13.0"

[tool.uv.workspace]
members = ["infra/host", "packages/boxie", "packages/boxie/tests/support", "tools/cli-playground", "packages/boxie/infra", "tools/cli-playground/infra", "tools/cli-bench", "tools/cli-check", "tools/local-dev", "tools/cli-record", "tools/sanctuary-dev"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "PGH003", "PGH004"]

[tool.mypy]
python_version = "3.15"
plugins = ["pydantic.mypy"]
files = ["packages", "tools", "infra"]
mypy_path = ["tools", "infra/host/tests"]
strict = true
# Pulumi entry points share this filename; their implementation modules are checked.
exclude = ["infra/environments/single-host/__main__.py"]

[tool.pytest]
testpaths = ["infra/host/tests", "infra/environments/single-host/tests", "packages/boxie/tests", "tools/cli-bench/tests", "tools/cli-playground/tests", "tools/cli-check/tests", "tools/local-dev/tests", "tools/cli-record/tests", "tools/repository_policy/tests", "tools/sanctuary-dev/tests"]
pythonpath = ["tools", "tools/cli-bench", "infra/host/tests", "packages/boxie/tests"]
addopts = ["--strict-config", "--strict-markers", "-p", "boxie_test_support.dependencies", "-m", "not integration"]
markers = ["integration: real isolated builds/installations and external-tool checks; prerequisites required"]

[tool.uv.sources]
local-dev = { workspace = true }
cli-record = { workspace = true }
sanctuary-dev = { workspace = true }
cli-bench = { workspace = true }
cli-check = { workspace = true }
boxie = { workspace = true }
boxie-test-support = { workspace = true }
cli-playground = { workspace = true }
boxie-infra = { workspace = true }
host-infra = { workspace = true }
