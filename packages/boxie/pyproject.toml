[project]
name = "boxie"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "opentelemetry-api",
    "aiodocker>=0.27,<1",
    "aiohttp>=3.13,<4",
    "alembic>=1.18,<2",
    "fastapi>=0.163.1",
    "httpx>=0.28",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2,<3",
    "psycopg[binary]==3.3.9",
    "prometheus-client==0.26.0",
    "sqlalchemy[asyncio]>=2.1.9,<2.2",
    "sqlmodel>=0.0.37,<0.1",
    "temporalio==1.36.1",
    "uvicorn>=0.40",
    "websockets>=16",
]

[project.scripts]
boxie-supervisor = "boxie.bootstrap.supervisor:main"
boxie-api = "boxie.bootstrap.api:main"

[project.optional-dependencies]
telemetry = [
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-aiohttp-client",
    "opentelemetry-instrumentation-httpx",
    "temporalio[opentelemetry]==1.36.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/boxie", "alembic", "alembic.ini"]

[tool.hatch.build.targets.wheel]
packages = ["src/boxie"]

[tool.hatch.build.targets.wheel.force-include]
alembic = "boxie/alembic"
