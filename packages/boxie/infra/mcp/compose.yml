name: boxie-mcp
services:
  grafana-bootstrap:
    profiles: [operations]
    image: ${BOXIE_IMAGE:?provide approved immutable Boxie image}
    user: '472:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 134217728
    pids_limit: 64
    entrypoint: [python, /bootstrap.py]
    networks: [grafana-origin]
    volumes:
    - ../boxie_infra/mcp.py:/bootstrap.py:ro
    - /etc/sanctuary/grafana-admin:/admin-password:ro
    - /etc/sanctuary/mcp:/credentials
  grafana:
    image: docker.io/grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
    user: '472:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 268435456
    pids_limit: 128
    stdin_open: true
    entrypoint: [/bin/sh, /start-grafana.sh]
    environment:
      GRAFANA_URL: http://grafana:3000
    networks: [grafana-origin]
    volumes:
    - ./start-grafana.sh:/start-grafana.sh:ro
    - /etc/sanctuary/mcp/grafana-token:/run/secrets/grafana-token:ro
  temporal:
    image: docker.io/temporalio/temporal-mcp:0.0.6@sha256:08af9f6c5ab4c98d953b43c0396be9c10858c13e64a6fde6336d778786b034b8
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 268435456
    pids_limit: 128
    stdin_open: true
    command: [--stdio, --config, /config.yaml]
    environment:
      SSL_CERT_FILE: /certs/frontend-ca.pem
    networks: [control]
    volumes:
    - ./temporal.yaml:/config.yaml:ro
    - /etc/sanctuary/tls/operator:/certs:ro
networks:
  grafana-origin:
    external: true
    name: boxie-grafana-origin
  control:
    external: true
    name: boxie-control
