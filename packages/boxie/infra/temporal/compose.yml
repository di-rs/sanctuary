name: boxie-temporal
x-admin:
  profiles: &id001
  - operations
  networks: &id002
  - control
services:
  temporal:
    image: temporalio/server:1.32.2@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - set -- $$(getent ahostsv4 temporal-internode); test "$$#" -gt 0; export TEMPORAL_BROADCAST_ADDRESS=$$1;
      exec /usr/local/bin/temporal-server --config-file /etc/temporal/config.yaml --allow-no-auth start
      --service=frontend --service=history --service=matching --service=worker
    environment:
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?provide persistence database password}
      VISIBILITY_DB_PASSWORD: ${VISIBILITY_DB_PASSWORD:?provide visibility database password}
    volumes:
    - ./config.yaml:/etc/temporal/config.yaml:ro
    - ${TEMPORAL_CERTS_DIR:?provide server certificate directory}:/certs:ro
    networks:
      control:
        aliases:
        - temporal-internode
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: boxie-temporal-temporal
  schema:
    image: temporalio/admin-tools:1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
    profiles: *id001
    networks: *id002
    entrypoint:
    - /bin/sh
    - /scripts/schema.sh
    environment:
      SQL_HOST: postgres
      SQL_PORT: '5432'
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?provide persistence database password}
      VISIBILITY_DB_PASSWORD: ${VISIBILITY_DB_PASSWORD:?provide visibility database password}
    volumes:
    - ./schema.sh:/scripts/schema.sh:ro
  bootstrap:
    profiles:
    - operations
    networks:
    - control
    image: ${BOXIE_IMAGE:?provide approved immutable Boxie image}
    user: 1000:1000
    entrypoint:
    - python
    - -m
    - boxie.bootstrap.temporal
    volumes:
    - ${TEMPORAL_OPERATOR_CERTS_DIR:?provide operator certificate directory}:/certs:ro
  ui:
    image: temporalio/ui:2.58.1@sha256:ac3c13eddb4547d830991bb5eee93a5d97140134522b7297fdb2be1fe25ef925
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TLS_CA: /certs/frontend-ca.pem
      TEMPORAL_TLS_CERT: /certs/ui-client.pem
      TEMPORAL_TLS_KEY: /certs/ui-client.key
      TEMPORAL_TLS_SERVER_NAME: temporal
      TEMPORAL_TLS_ENABLE_HOST_VERIFICATION: 'true'
    volumes:
    - ${TEMPORAL_UI_CERTS_DIR:?provide UI certificate directory}:/certs:ro
    networks:
      control: {}
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: boxie-temporal-ui
networks:
  control:
    external: true
    name: ${BOXIE_CONTROL_NETWORK:?provide private control network name}
