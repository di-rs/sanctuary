name: boxie-observability
services:
  storage-init:
    image: docker.io/timberio/vector:0.62.0-debian@sha256:6266b1d35c844918ff1c48ea2ec4f57c2b0664c46f3e17fc2418d5dda1692068
    user: 0:0
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    security_opt:
    - no-new-privileges:true
    network_mode: none
    pids_limit: 16
    mem_limit: 33554432
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - chown 65532:65532 /vector-data; chown 65534:65534 /logs-data
    volumes:
    - vector-data:/vector-data
    - logs-data:/logs-data
  vector:
    image: ${OBS_COLLECTOR_IMAGE:-boxie-collector:local}
    user: 65532:65532
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    pids_limit: 128
    mem_limit: ${OBS_VECTOR_MEMORY_BYTES:-268435456}
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: observability-vector
    networks:
      metrics:
        aliases:
        - vector
      ingest:
        aliases:
        - vector
    group_add:
    - ${OBS_JOURNAL_GROUP_GID:?Set numeric host journal group}
    environment:
      VECTOR_LOG: info
      BOXIE_ENVIRONMENT: ${BOXIE_ENVIRONMENT:-production}
      BOXIE_HOST_ID: ${BOXIE_HOST_ID:-boxie-host}
    command:
    - --config
    - /etc/vector/vector.yaml
    volumes:
    - ./vector.yaml:/etc/vector/vector.yaml:ro
    - ${OBS_JOURNAL_DIRECTORY:-/var/log/journal}:/var/log/journal:ro
    - ${OBS_MACHINE_ID_PATH:-/etc/machine-id}:/etc/machine-id:ro
    - vector-data:/var/lib/vector
    tmpfs:
    - /tmp:size=16777216
    depends_on:
      storage-init:
        condition: service_completed_successfully
    build:
      context: ./collector
  victorialogs:
    image: docker.io/victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    user: 65534:65534
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    pids_limit: 128
    mem_limit: ${OBS_LOGS_MEMORY_BYTES:-1073741824}
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: observability-victorialogs
    networks:
      ingest:
        aliases:
        - victorialogs
      query:
        aliases:
        - victorialogs
      metrics:
        aliases:
        - victorialogs
    command:
    - -httpListenAddr=:9428
    - -storageDataPath=/victoria-logs-data
    - -retentionPeriod=${OBS_LOGS_RETENTION_DAYS:-7}d
    - -retention.maxDiskSpaceUsageBytes=${OBS_LOGS_DISK_BYTES:-268435456}
    - -metrics.exposeMetadata
    - -loggerLevel=INFO
    volumes:
    - logs-data:/victoria-logs-data
    depends_on:
      storage-init:
        condition: service_completed_successfully
  prometheus:
    image: docker.io/prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    user: 65534:65534
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    pids_limit: 128
    mem_limit: ${OBS_PROMETHEUS_MEMORY_BYTES:-536870912}
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: observability-prometheus
    networks:
      metrics:
        aliases:
        - prometheus
      query:
        aliases:
        - prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=${OBS_PROMETHEUS_RETENTION_DAYS:-7}d
    - --storage.tsdb.retention.size=${OBS_PROMETHEUS_RETENTION_BYTES:-2147483648}B
    - --web.listen-address=0.0.0.0:9090
    - --log.level=info
    volumes:
    - ${OBS_PROMETHEUS_CONFIG_FILE:?Set envsubst-rendered Prometheus config}:/etc/prometheus/prometheus.yml:ro
    - ./rules:/etc/prometheus/rules:ro
    - prometheus-data:/prometheus
  grafana:
    image: docker.io/grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    user: '472:0'
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 268435456
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: observability-grafana
    networks:
      query:
        aliases:
        - grafana
      grafana-origin:
        aliases:
        - grafana
    environment:
      GOGC: '25'
      GF_LOG_LEVEL: info
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_AUTH_DISABLE_LOGIN_FORM: 'false'
      GF_SECURITY_COOKIE_SECURE: 'true'
      GF_PLUGINS_PREINSTALL: ''
      GF_PLUGINS_PREINSTALL_SYNC: ''
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ''
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_SERVER_ROOT_URL: https://${OBS_GRAFANA_HOSTNAME:?Set exact Grafana hostname}
    volumes:
    - grafana-data:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    - ./grafana/dashboards:/etc/grafana/dashboards:ro
    - ${OBS_GRAFANA_PLUGIN_DIR:?Set verified pinned plugins}:/var/lib/grafana/plugins:ro
    tmpfs:
    - /tmp:size=16777216
    secrets:
    - grafana-admin
  node-exporter:
    image: ghcr.io/prometheus/node-exporter:v1.13.1@sha256:d9b8bcd4c7d98e75f915850b92fcbf82ae4d5210902d27cae9af567128de1dea
    user: 65534:65534
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    pids_limit: 128
    mem_limit: ${OBS_EXPORTER_MEMORY_BYTES:-67108864}
    logging:
      driver: journald
      options:
        mode: non-blocking
        max-buffer-size: 4m
        tag: observability-node-exporter
    networks:
      metrics:
        aliases:
        - node-exporter
    command:
    - --collector.disable-defaults
    - --collector.filesystem
    - --collector.meminfo
    - --path.rootfs=/host
    - --path.procfs=/host/proc
    - --web.listen-address=0.0.0.0:9100
    - --web.telemetry-path=/metrics
    - --log.level=info
    volumes:
    - type: bind
      source: /
      target: /host
      read_only: true
      bind:
        propagation: rslave
        create_host_path: false
    tmpfs:
    - /host/run:ro,nosuid,nodev,noexec,mode=000,size=4096
    - /host/var/run:ro,nosuid,nodev,noexec,mode=000,size=4096
volumes:
  vector-data: {}
  logs-data: {}
  prometheus-data: {}
  grafana-data: {}
networks:
  metrics:
    external: true
    name: ${OBS_METRICS_NETWORK:-boxie-metrics}
  grafana-origin:
    external: true
    name: ${OBS_GRAFANA_ORIGIN_NETWORK:-boxie-grafana-origin}
  ingest:
    internal: true
  query:
    internal: true
secrets:
  grafana-admin:
    file: ${OBS_GRAFANA_ADMIN_PASSWORD_FILE:?Set private Grafana admin file}
