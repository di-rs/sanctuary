services:
  schema:
    image: temporalio/admin-tools:1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
    env_file: ${STATE}/secrets/temporal/database.env
    volumes:
      - ./temporal-schema.sh:/schema.sh:ro
    entrypoint: ["/bin/sh", "/schema.sh"]
    networks: [database]
  temporal:
    image: temporalio/server:1.32.2@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
    restart: unless-stopped
    depends_on:
      schema: {condition: service_completed_successfully}
    env_file: ${STATE}/secrets/temporal/database.env
    environment:
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: sanctuary-postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      NUM_HISTORY_SHARDS: "4"
      TEMPORAL_TLS_REFRESH_INTERVAL: 1m
      TEMPORAL_TLS_REQUIRE_CLIENT_AUTH: "true"
      TEMPORAL_TLS_SERVER_CERT: /tls/cert.pem
      TEMPORAL_TLS_SERVER_KEY: /tls/key.pem
      TEMPORAL_TLS_SERVER_CA_CERT: /tls/ca.pem
      TEMPORAL_TLS_INTERNODE_SERVER_NAME: temporal
      TEMPORAL_TLS_FRONTEND_CERT: /tls/cert.pem
      TEMPORAL_TLS_FRONTEND_KEY: /tls/key.pem
      TEMPORAL_TLS_CLIENT1_CA_CERT: /tls/ca.pem
      TEMPORAL_TLS_CLIENT2_CA_CERT: /tls/ca.pem
      TEMPORAL_TLS_FRONTEND_SERVER_NAME: temporal
    volumes:
      - ${STATE}/tls/temporal:/tls:ro
      - ./temporal-dynamic.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    networks: [database, temporal]
  ui:
    image: temporalio/ui:2.58.1@sha256:ac3c13eddb4547d830991bb5eee93a5d97140134522b7297fdb2be1fe25ef925
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_DEFAULT_NAMESPACE: ${TEMPORAL_NAMESPACE}
      TEMPORAL_TLS_CA: /tls/ca.pem
      TEMPORAL_TLS_CERT: /tls/cert.pem
      TEMPORAL_TLS_KEY: /tls/key.pem
      TEMPORAL_TLS_SERVER_NAME: temporal
      TEMPORAL_TLS_ENABLE_HOST_VERIFICATION: "true"
      TEMPORAL_CORS_ORIGINS: https://${TEMPORAL_HOST}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/v1/namespaces]
      interval: 5s
      timeout: 4s
      retries: 24
    volumes:
      - ${STATE}/tls/ui:/tls:ro
    networks:
      temporal: {}
      admin: {aliases: [temporal-ui]}
networks:
  database: {external: true, name: "${SITE}-database"}
  temporal: {external: true, name: "${SITE}-temporal"}
  admin: {external: true, name: "${SITE}-admin"}
