global: {scrape_interval: 30s, evaluation_interval: 30s}
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ["alerts:9093"]}]
scrape_configs:
  - job_name: boxie-api
    static_configs: [{targets: ["boxie-api:9101"]}]
  - job_name: boxie-supervisor
    static_configs: [{targets: ["supervisor:9103"]}]
  - job_name: playground
    static_configs: [{targets: ["playground:9104"]}]
  - job_name: host
    static_configs: [{targets: ["host-metrics:9100"]}]
