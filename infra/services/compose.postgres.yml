services:
  db:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/admin
    volumes:
      - ${STATE}/postgres/data:/var/lib/postgresql
      - ${STATE}/secrets/postgres/admin:/run/secrets/admin:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      database:
        aliases: [sanctuary-postgres]
networks:
  database: {external: true, name: "${SITE}-database"}
